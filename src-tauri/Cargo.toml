[package]
name = "zoo"
version = "0.1.0"
description = "A menu bar monster for every running agent session"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
png = "0.18"

[dependencies]
# Pinned: the tray uses with_inner_tray_icon, which Tauri documents as version-sensitive.
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSEnumerator", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSImage", "NSWindow", "NSEvent", "NSScreen", "block2"] }

[profile.release]
strip = true
